version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    ports:
      - "3306:3306"
    env_file: .env-mysql
    volumes:
      - bioskop-data:/var/lib/mysql
      - ./baza.sql:/docker-entrypoint-initdb.d/baza.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bioskop

  wordpress:
    image: wordpress:latest
    container_name: wordpress
    env_file:
      - .env-wordpress
    restart: always
    depends_on:
      - mysql
    ports:
      - "8080:80"
    volumes:
      - ./wordpress:/var/www/html
    networks:
      - bioskop

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    depends_on:
      - mysql
    env_file:
      - .env-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    networks:
      - bioskop

networks:
  bioskop:

volumes:
  bioskop-data:
